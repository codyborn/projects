<style>
:root{--bg:#fff;--ink:#111;--muted:#888;--rule:#eee;--accent:#b33;--card:#fff;--cardline:#ddd}

*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:'Helvetica Neue',-apple-system,sans-serif;transition:background .3s,color .3s}
.wrap{max-width:1040px;margin:0 auto;padding:70px 28px 60px}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:2px;margin:0 0 2px;font-weight:800}
.sub{font-size:12px;color:var(--muted);letter-spacing:3px;line-height:1.5;text-transform:uppercase;margin-bottom:22px}

.grid{display:grid;grid-template-columns:repeat(var(--cols,8),minmax(0,1fr));grid-auto-rows:var(--row,58px);gap:6px}
.cell{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;transition:z-index 0s .15s;min-width:0;min-height:0}
.cell img{max-width:96%;max-height:78%;width:auto;height:auto;object-fit:contain;transition:transform .25s ease;filter:drop-shadow(0 0 0 transparent)}
body.night-mode .cell img{filter:drop-shadow(0 0 10px rgba(255,255,255,.07))}
.cell .lbl{font-size:9px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;text-align:center;line-height:1.15;margin-top:3px;padding:0 2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:none}
.cell.hov{z-index:50;transition:z-index 0s}
.cell.hov img{transform:scale(1.3);filter:drop-shadow(0 8px 22px rgba(0,0,0,.25))}
.card{position:absolute;left:50%;transform:translateX(-50%) translateY(6px);top:calc(100% + 2px);width:230px;background:var(--card);border:1px solid var(--cardline);border-radius:10px;box-shadow:0 12px 34px rgba(0,0,0,.22);padding:12px 14px;opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:60;text-align:left}
.cell.hov .card{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.card.above{top:auto;bottom:calc(100% + 2px)}
.card h3{margin:0 0 3px;font-size:13px;letter-spacing:.5px}
.card .t{font-size:11px;color:var(--muted);line-height:1.35;margin:0 0 6px}
.card .d{font-size:11.5px;line-height:1.45;margin:0 0 8px}
.card a{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--accent);text-decoration:none;border-bottom:1px solid var(--accent)}
.topbar{position:fixed;top:10px;left:20px;z-index:99;display:flex;gap:10px;align-items:stretch}
.pill{width:60px;height:48px;display:flex;align-items:center;justify-content:center;padding:0;background:rgba(44,62,80,.9);color:#fff;border:none;border-radius:25px;font-size:1.2rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);backdrop-filter:blur(10px);text-decoration:none;transition:all .3s ease;font-family:inherit}
.pill:hover{background:rgba(44,62,80,1);transform:scale(1.05)}
.pill svg{width:1.2em;height:1.2em}
.foot{margin-top:34px;font-size:10px;color:var(--muted);display:flex;justify-content:space-between;letter-spacing:1px}
@media (max-width:640px){
  .wrap{padding:64px 12px 40px}.grid{gap:5px}.cell .lbl{font-size:8.5px;letter-spacing:.2px;line-height:1.1;margin-top:2px}.cell img{max-height:68%}.sub{letter-spacing:2px}
  .card{position:fixed;left:12px;right:12px;bottom:12px;top:auto;width:auto;transform:translateY(12px);padding:16px 18px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
  .cell.hov .card{transform:none}
  .card.above{top:auto;bottom:12px}
  .card h3{font-size:16px}.card .t{font-size:13px}.card .d{font-size:14px;line-height:1.5}.card a{font-size:12px}
  .card .x{position:absolute;top:8px;right:12px;font-size:20px;line-height:1;color:var(--muted);cursor:pointer}
  .foot{flex-direction:column;gap:4px}
}
@media (min-width:641px){.card .x{display:none}}
</style>
</head>

const CATS = ["CARRY + TECH", "CLOTHING", "ADVENTURE GEAR", "SUPPLEMENTS", "SKINCARE", "EVERYTHING ELSE"];
if (localStorage.getItem('night-mode') === 'true') document.body.classList.add('night-mode');
document.getElementById('nm-ico').textContent = document.body.classList.contains('night-mode') ? '☀️' : '🌙';
function toggleNight(){
  document.body.classList.toggle('night-mode');
  localStorage.setItem('night-mode', document.body.classList.contains('night-mode'));
  document.getElementById('nm-ico').textContent = document.body.classList.contains('night-mode') ? '☀️' : '🌙';
}
const sections = document.getElementById('sections');
const grids = [];  // {el, cells:[{el,w,h}]}
const isTouch = matchMedia('(hover: none)').matches;

function pack(pieces, width) {
  // first-fit-decreasing bin packing: big pieces first, small ones fill the holes (mirrors the print generator)
  const order = pieces.slice().sort((a, b) => (b.w*b.h - a.w*a.h) || (b.h - a.h) || (b.w - a.w));
  const grid = [];
  for (const it of order) {
    const w = Math.min(it.w, width), h = it.h;
    for (let y = 0; ; y++) {
      while (grid.length < y + h) grid.push(new Array(width).fill(false));
      let placed = false;
      for (let x = 0; x <= width - w && !placed; x++) {
        let free = true;
        for (let dy = 0; dy < h && free; dy++) for (let dx = 0; dx < w; dx++) if (grid[y+dy][x+dx]) { free = false; break; }
        if (!free) continue;
        for (let dy = 0; dy < h; dy++) for (let dx = 0; dx < w; dx++) grid[y+dy][x+dx] = true;
        it.el.style.gridColumn = (x+1) + ' / span ' + w;
        it.el.style.gridRow = (y+1) + ' / span ' + h;
        placed = true;
      }
      if (placed) break;
    }
  }
}

let lastCols = 0;
function layout(force) {
  const width = sections.clientWidth;
  if (!width) return;
  // aim for ~110px columns, never fewer than 4 (the widest items are 4 across) nor more than 8 (the print grid)
  const cols = Math.max(4, Math.min(8, Math.round(width / 110)));
  const gap = width < 641 ? 5 : 6;
  const cellW = (width - gap * (cols - 1)) / cols;
  document.documentElement.style.setProperty('--cols', cols);
  document.documentElement.style.setProperty('--row', (cellW * 0.5).toFixed(1) + 'px');
  if (cols === lastCols && !force) return;
  lastCols = cols;
  for (const g of grids) pack(g.cells, cols);
}

function closeAll(except) {
  document.querySelectorAll('.cell.hov').forEach(c => { if (c !== except) c.classList.remove('hov'); });
}

for (const cat of CATS) {
  const group = ITEMS.filter(i => i.cat === cat);
  if (!group.length) continue;
  const h = document.createElement('div'); h.className = 'cat'; h.textContent = cat;
  const g = document.createElement('div'); g.className = 'grid';
  const cells = [];
  for (const it of group) {
    const c = document.createElement('div');
    c.className = 'cell';
    const card = ['<div class="card"><span class="x" aria-label="Close">&times;</span><h3>' + it.label + '</h3>',
      '<p class="t">' + it.title + '</p>',
      it.desc ? '<p class="d">' + it.desc + '</p>' : '',
      it.url ? '<a href="' + it.url + '" target="_blank" rel="noopener">View product ↗</a>' : '',
      '</div>'].join('');
    c.innerHTML = '<img src="' + it.img + '" alt="' + it.label + '" loading="lazy"><div class="lbl">' + it.label + '</div>' + card;
    const open = () => {
      closeAll(c);
      c.classList.add('hov');
      const cd = c.querySelector('.card');
      const r = c.getBoundingClientRect();
      cd.classList.toggle('above', r.bottom + 190 > window.innerHeight);
    };
    if (isTouch) {
      c.addEventListener('click', e => {
        if (e.target.closest('.card a')) return;           // let the product link through
        if (e.target.closest('.x')) { c.classList.remove('hov'); return; }
        c.classList.contains('hov') && !e.target.closest('.card') ? c.classList.remove('hov') : open();
      });
    } else {
      c.addEventListener('mouseenter', open);
      c.addEventListener('mouseleave', () => c.classList.remove('hov'));
    }
    g.appendChild(c);
    cells.push({el: c, w: it.w, h: it.h});
  }
  grids.push({el: g, cells});
  sections.appendChild(h); sections.appendChild(g);
}
if (isTouch) document.addEventListener('click', e => { if (!e.target.closest('.cell')) closeAll(); });

layout(true);
let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => layout(false)); }).observe(sections);
</script>
