<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4dd0e1">
  <title>Citizen Earth</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌎</text></svg>">
  <script>
    if (localStorage.getItem('night-mode') === 'true') document.documentElement.classList.add('night-preload');
  </script>
  <script type="module" crossorigin src="./assets/index-Dq_Fsuux.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/shapes-DjQ26ZvK.js">
  <link rel="stylesheet" crossorigin href="./assets/index-DkS7y3Fb.css">
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>
  <div id="scroll-spacer"></div>
  <div id="loading">Setting sail…</div>

  <div class="top-controls">
    <button class="night-mode-toggle" id="night-toggle" aria-label="Toggle night mode"></button>
    <button class="latest-blog-toggle" id="latest-blog" title="Latest blog post" aria-label="Latest blog post">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="2"></rect>
        <line x1="8" y1="8" x2="16" y2="8"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
        <line x1="8" y1="16" x2="13" y2="16"></line>
      </svg>
    </button>
    <a class="gear-toggle" href="/map/gear.html" title="What's in my bag" aria-label="What's in my bag">🎒</a>
  </div>

  <div id="sunk-ships-counter"></div>

  <div class="blog-overlay" id="blog-overlay">
    <div class="blog-content" id="blog-content">
      <div class="blog-header">
        <h2 class="blog-title" id="blog-title"></h2>
        <div class="blog-actions">
          <button class="share-button" id="share-button">Share</button>
          <button class="return-button" id="close-button">Close</button>
        </div>
      </div>
      <div class="blog-hero" id="blog-hero"></div>
      <div class="blog-text" id="blog-text"></div>
      <div class="blog-footer">
        <button class="nav-button" id="prev-button"></button>
        <button class="nav-button" id="next-button"></button>
      </div>
    </div>
  </div>

  <script>
    // Deep links (?city=X, ?blog=latest) render the post right away, before the 3D bundle downloads.
    // The bundle adopts the open post via window.__pre. Keep POSTS in step with the blog cities in the bundle.
    (function () {
      var POSTS = [
        ['Miami', 'miami', 'Tied down', 'miami'],
        ['Hyeres', 'hyeres', 'Bread is the answer', 'hyeres'],
        ['Antibes', 'antibes', "When you can't beat em", 'antibes'],
        ['Dakhla', 'dakhla', 'The French have watches', 'dakhla'],
        ['New York', 'new_york', 'The City', 'NY'],
        ['Montana', 'montana', 'Minerals', 'montana'],
        ['Boulder', 'boulder', 'Bierstadt', 'boulder'],
        ['Zermatt', 'zermatt', 'Zermatt', 'switzerland'],
        ['Nepal', 'kathmandu', 'Kathmandu', 'nepal']
      ];
      var q = new URLSearchParams(location.search);
      if (q.get('preview') !== null) return;
      var post = null, city = q.get('city');
      if (q.get('blog') === 'latest') post = POSTS[POSTS.length - 1];
      else if (city) post = POSTS.filter(function (x) { return x[0].toLowerCase() === city.toLowerCase(); })[0];
      if (!post) return;
      var blog = './posts/' + post[1] + '.md';
      window.__pre = { blog: blog };
      var path = function (u) { return u.indexOf('./') === 0 ? '/map/' + u.slice(2) : u; };
      function render(md) {
        md = md.replace(/!\[([^\]]*)\]\(([^)]+)\)/gm, function (m, a, u) { return '<div class="image-container"><img src="' + path(u) + '" alt="' + a + '"></div>'; });
        var out = '', i = 0;
        md.split('\n').forEach(function (line) {
          if (!line.trim()) return;
          var t = line;
          if (t.indexOf('<div class="image-container">') === -1) {
            t = t.replace(/^### (.*$)/gim, '<h3>$1</h3>').replace(/^## (.*$)/gim, '<h2>$1</h2>').replace(/^# (.*$)/gim, '<h1>$1</h1>')
              .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>')
              .replace(/__(.*?)__/g, '<strong>$1</strong>').replace(/_(.*?)_/g, '<em>$1</em>')
              .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            if (!/^<(h[1-6]|div)/.test(t)) t = '<p>' + t + '</p>';
          }
          var tag = (t.match(/^<(\w+)/) || [0, 'p'])[1], inner = t.replace(/^<[^>]+>/, '').replace(/<\/\w+>$/, '');
          var cls = tag === 'div' ? 'image-container paragraph-fade' : 'paragraph-fade';
          out += tag === 'div' ? t.replace('class="image-container"', 'class="' + cls + '" style="animation-delay: ' + (i * 0.3) + 's;"')
                               : '<' + tag + ' class="' + cls + '" style="animation-delay: ' + (i * 0.3) + 's;">' + inner + '</' + tag + '>';
          i++;
        });
        return out;
      }
      var $ = function (id) { return document.getElementById(id); };
      $('prev-button').style.visibility = 'hidden';
      $('next-button').style.visibility = 'hidden';
      fetch('/map/posts/' + post[1] + '.md').then(function (r) { if (!r.ok) throw 0; return r.text(); }).then(function (md) {
        if (!window.__pre || window.__pre.handoff) return;
        $('blog-title').textContent = post[2];
        $('blog-hero').innerHTML = '<img src="/islands/' + post[3] + '.webp" alt="' + post[0] + '">';
        $('blog-text').innerHTML = render(md);
        $('blog-overlay').classList.add('active');
        $('blog-content').scrollTop = 0;
        document.body.classList.add('reading');
        $('close-button').addEventListener('click', function () {
          if (window.__pre && window.__pre.handoff) return;
          window.__pre = null;
          $('blog-overlay').classList.remove('active');
          document.body.classList.remove('reading');
          history.pushState({}, document.title, location.pathname);
        });
      }).catch(function () { window.__pre = null; });
    })();
  </script>

  <footer class="version">Version 2.0.0-alpha · <a href="./credits.html">3D model credits</a></footer>

</body>
</html>
